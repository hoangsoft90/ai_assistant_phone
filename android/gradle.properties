org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# P1F (K30 — đo trên máy thật 2026-09-22): plugin Flutter (được apply sau build.gradle của app) GHI ĐÈ
# `defaultConfig.ndk.abiFilters` bằng `clear()` + `addAll(PLATFORM_ABI_LIST)` = [armeabi-v7a,
# arm64-v8a, x86_64] — xem FlutterPlugin.kt > configureAbiWithoutSplits. Vì vậy khai báo
# `abiFilters += ["arm64-v8a"]` trong app/build.gradle.kts MỘT MÌNH KHÔNG CÓ TÁC DỤNG: APK debug đã
# nặng 155MB với 3 bản mỗi thư viện native (libflutter/libwhisper/libggml/libvosk/libjnidispatch) và
# CI phải build CMake cho 3-4 ABI. Property này là đường duy nhất để plugin không ghi đè
# (`shouldProjectDisableAbiFiltering`). Đặt ở đây để build local giống hệt CI.
disable-abi-filtering=true
